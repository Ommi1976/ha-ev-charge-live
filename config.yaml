name: "EV Charge Live Monitor"
slug: "ev_charge_live"
description: "Echtzeit-Belegungsmonitor für E-Auto-Ladestationen (inkl. Stadtwerke Hockenheim) mit interaktiver Ingress-Karte, Favoriten und Push-Benachrichtigungen."
version: "1.3.17"
url: "https://github.com/Ommi1976/ha-ev-charge-live"
startup: "application"
boot: "auto"
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:ev-station"
panel_title: "EV Charge Live"
homeassistant_api: true

schema:
  polling:
    interval_seconds: "int(15,600)"
    request_timeout: "int(5,60)"
  location_defaults:
    city: "str"
    postal_code: "str"
    latitude: "float"
    longitude: "float"
    search_radius_meters: "int(500,50000)"
    device_tracker_entity: "str?"
  notifications:
    enabled: "bool"
    service: "str"
    cooldown_minutes: "int(1,120)"
    min_free_slots_to_trigger: "int(1,10)"
    notify_on_all_busy: "bool"
    title_template: "str"
    message_template: "str"
  home_assistant_integration:
    entity_prefix: "str"
    create_device_tracker: "bool"
    fire_ha_events: "bool"
    mqtt_enabled: "bool"
    mqtt_topic_prefix: "str"
  logging:
    level: "list(debug|info|warning|error)"

options:
  polling:
    interval_seconds: 60
    request_timeout: 15
  location_defaults:
    city: "Hockenheim"
    postal_code: "68766"
    latitude: 49.317584
    longitude: 8.545261
    search_radius_meters: 5000
    device_tracker_entity: "device_tracker.2407fpn8eg"
  notifications:
    enabled: true
    service: "notify.notify"
    cooldown_minutes: 10
    min_free_slots_to_trigger: 1
    notify_on_all_busy: false
    title_template: "⚡ Ladestation frei: {station_name}"
    message_template: "An {station_name} ({address}) sind jetzt {free_slots} von {total_slots} Plätzen frei!"
  home_assistant_integration:
    entity_prefix: "sensor.ev_charge_"
    create_device_tracker: true
    fire_ha_events: true
    mqtt_enabled: false
    mqtt_topic_prefix: "homeassistant/sensor/ev_charge"
  logging:
    level: "info"
